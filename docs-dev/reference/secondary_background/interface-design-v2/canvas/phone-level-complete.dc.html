<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Phone · Warm-up complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Spectral:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7fb4ec}a:hover{color:#a9cdf3}

*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  /* eek-a-style roles: dark identity default (data/visual/tokens.css) */
  --color-text:#f4f2ec;
  --color-muted-text:#9a9aa4;
  --color-faint:#787884;
  --color-background:#08080b;
  --color-surface:#17181e;
  --color-border:#2a2a35;
  --color-accent:#e8b43a;
  --color-accent-ink:#1a1400;
  --color-secondary:#6ba6e4;
  --color-secondary-muted:#69707d;
  --color-link:#7fb4ec;
  --color-success:#3ad08a;
  --color-warning:#f0b429;
  --color-error:#ff6f61;
  --color-info:#6ba6e4;
  --color-focus:#6ba6e4;
  --color-reference:#000000;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:40px;
  --radius-control:12px;--radius-card:14px;--radius-sheet:22px;--radius-pill:999px;
  --font-serif:Spectral,'Iowan Old Style',Georgia,serif;
  --font-sans:Lexend,Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',SFMono-Regular,Consolas,monospace;
  --font-size-sm:14px;--font-size-md:16px;--font-size-lg:20px;--font-size-xl:28px;
  --font-weight-regular:400;--font-weight-medium:500;--font-weight-bold:700;
  --line-height-tight:1.25;--line-height-normal:1.55;
  /* eek-a-calibrate app roles (theme-independent: the stage is always grey) */
  --stage:#808080;
  --stage-ink:#000000;
  --stage-veil:rgb(128 128 128 / 0.86);
  --stage-line:rgb(0 0 0 / 0.28);
  --stage-lit:rgb(255 255 255 / 0.18);
  --stage-scrim:rgb(0 0 0 / 0.55);
  --stage-chip:rgb(23 24 30 / 0.92);
  --stage-chip-raise:rgb(255 255 255 / 0.08);
  --stage-chip-text:#f4f2ec;
  --stage-chip-muted:#9a9aa4;
  --stage-focus:#ffffff;
  --state-good:#3ad08a;
  --state-adjust:#f0b429;
  --state-lost:#ff6f61;
  --halo:rgb(0 0 0 / 0.6);
  --preview-bg:#1c1d23;
  --preview-figure:#34363f;
  --preview-edge:#4a4d58;
  --preview-bright:#a9aab2;
  --preview-dark:#141519;
  --badge-ink:#17181e;
  --gaze:#6ba6e4;
  --gaze-soft:rgb(107 166 228 / 0.42);
  --gaze-outline:#000000;
  /* v2 game roles: one bubble everywhere (warm-up, re-aim, challenge) */
  --bubble-fill:rgb(255 255 255 / 0.30);
  --bubble-edge:#000000;
  --bubble-shine:#ffffff;
  --bubble-core:#000000;
  --bubble-ghost:rgb(0 0 0 / 0.30);
  --firefly-light:rgb(255 255 255 / 0.45);
  --firefly-trail:rgb(255 255 255 / 0.40);
  --decoy:#24242a;
  --pip-on:#000000;
  --pip-off:rgb(0 0 0 / 0.22);
  --arc-on:#000000;
  --arc-off:rgb(0 0 0 / 0.60);
  --node-done:rgb(255 255 255 / 0.12);
  --node-line:rgb(255 255 255 / 0.35);
  --star-on:var(--color-text);
  --star-off:var(--color-faint);
  --control-boundary:var(--color-faint);
  --tap:44px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --color-text:#1a1a1a;--color-muted-text:#5a5a5a;--color-faint:#70707a;
  --color-background:#ffffff;--color-surface:#f5f5f5;--color-border:#d9d9d9;
  --color-accent:#8a6d00;--color-accent-ink:#ffffff;
  --color-secondary:#1a6cb0;--color-secondary-muted:#6b7280;--color-link:#0061a8;
  --color-success:#1b7a4b;--color-warning:#8a5a00;--color-error:#b3261e;
  --color-info:#1a6cb0;--color-focus:#1a6cb0;
}
body{background:var(--color-background);color:var(--color-text);font-family:var(--font-sans);font-size:var(--font-size-md);line-height:var(--line-height-normal);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
.on-stage :focus-visible{outline-color:var(--stage-focus)}
@keyframes ek-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ek-live{animation:ek-pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ek-live{animation:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);min-block-size:var(--tap);padding:0 20px;border:1px solid transparent;border-radius:var(--radius-control);font-family:var(--font-sans);font-size:var(--font-size-md);font-weight:var(--font-weight-medium);line-height:var(--line-height-tight);white-space:nowrap;text-decoration:none;cursor:pointer;transition:background-color .2s ease-out,border-color .2s ease-out,box-shadow .2s ease-out}
.btn--primary,a.btn--primary,a.btn--primary:hover{background:var(--color-accent);color:var(--color-accent-ink)}
.btn--primary:hover{box-shadow:inset 0 0 0 999px rgb(255 255 255 / 0.10)}
.btn--secondary,a.btn--secondary,a.btn--secondary:hover{background:var(--color-surface);color:var(--color-text);border-color:var(--control-boundary)}
.btn--secondary:hover{border-color:var(--color-accent)}
.btn--ghost,a.btn--ghost,a.btn--ghost:hover{background:transparent;color:var(--color-text)}
.btn--ghost:hover{background:var(--color-surface)}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--color-surface);color:var(--color-muted-text);border-color:var(--color-border);box-shadow:none;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;inline-size:var(--tap);block-size:var(--tap);padding:0;border:0;border-radius:var(--radius-pill);background:transparent;color:inherit;cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--stage-chip-raise)}
.btn--chip,a.btn--chip,a.btn--chip:hover{background:var(--stage-chip-raise);color:var(--stage-chip-text);border-color:rgb(255 255 255 / 0.28)}
.btn--chip:hover{border-color:var(--color-accent)}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;min-block-size:72px;padding:8px 4px;border:1.5px solid var(--control-boundary);border-radius:var(--radius-control);background:var(--color-surface);color:var(--color-muted-text);font-family:var(--font-sans);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-tight);white-space:nowrap;cursor:pointer;transition:border-color .2s ease-out,color .2s ease-out,background-color .2s ease-out}
.choice:hover{border-color:var(--color-muted-text)}
.choice[aria-checked="true"]{border-color:var(--color-text);color:var(--color-text);background:var(--node-done)}
.chip{display:inline-flex;align-items:center;gap:6px;min-block-size:32px;padding:0 12px;border-radius:var(--radius-pill);background:var(--color-surface);color:var(--color-text);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-tight);white-space:nowrap}
.ex{display:inline-flex;align-items:center;min-block-size:24px;padding:0 8px;border:1px dashed var(--color-muted-text);border-radius:var(--radius-pill);color:var(--color-muted-text);font-size:var(--font-size-sm);font-weight:var(--font-weight-regular);line-height:1;white-space:nowrap}
.sr-only{position:absolute;inline-size:1px;block-size:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 24px 16px; background: var(--color-background); color: var(--color-text); font-family: var(--font-sans); display: flex; flex-direction: column">

  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; min-block-size: 48px">
    <div style="display: flex; align-items: center; gap: 10px; min-inline-size: 0">
      <span aria-hidden="true" style="font-size: 14px; font-weight: 500; line-height: 1.25; white-space: nowrap; color: var(--color-text)">Warm-up complete</span>
      <svg width="134" height="22" viewBox="0 0 134 22" aria-hidden="true" style="font-family: var(--font-sans); flex: none"><path d="M22 11h6M50 11h6M78 11h6M106 11h6" stroke="var(--node-line)" stroke-width="1.5"/><g fill="var(--node-done)"><circle cx="11" cy="11" r="11"/><circle cx="39" cy="11" r="11"/><circle cx="67" cy="11" r="11"/><circle cx="95" cy="11" r="11"/></g><g fill="none" stroke="var(--color-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 11.5l3 3 6-6.5"/><path d="M34.5 11.5l3 3 6-6.5"/><path d="M62.5 11.5l3 3 6-6.5"/><path d="M90.5 11.5l3 3 6-6.5"/></g><circle cx="123" cy="11" r="10.25" fill="none" stroke="var(--color-text)" stroke-width="1.5"/><path d="M123 5.1L124.6 9.3L129.1 9.5L125.6 12.3L126.8 16.7L123 14.2L119.2 16.7L120.4 12.3L116.9 9.5L121.4 9.3Z" fill="none" stroke="var(--color-text)" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span class="sr-only">Warm-up complete. Challenge unlocked</span>
    </div>
    <button class="icon-btn" type="button" aria-label="Details" style="flex: none; color: var(--color-text)">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>

  <main style="flex: 1 1 auto; min-block-size: 0; display: flex; flex-direction: column">

    <figure style="position: relative; flex: 1 1 auto; min-block-size: 0; margin: 8px 0 0; padding: 16px; border-radius: var(--radius-card); background: var(--color-surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
      <span class="ex" style="position: absolute; top: 12px; left: 12px">Example</span>

      <svg viewBox="0 0 176 380" width="176" height="380" role="img" aria-label="Your 3 zones: top, middle and bottom. 10 of 12 test bubbles hit." style="display: block; flex: 0 1 auto; min-block-size: 0; max-inline-size: 100%">
        <rect width="176" height="380" rx="10" fill="var(--stage)"/>
        <g fill="none" stroke="var(--stage-line)" stroke-width="1.5">
          <rect x="8" y="8" width="160" height="116" rx="8"/>
          <rect x="8" y="132" width="160" height="116" rx="8"/>
          <rect x="8" y="256" width="160" height="116" rx="8"/>
        </g>
        <g fill="var(--state-good)" stroke="var(--stage-ink)" stroke-width="1.5">
          <circle cx="26.4" cy="57" r="7.25"/>
          <circle cx="66.9" cy="57" r="7.25"/>
          <circle cx="109.1" cy="57" r="7.25"/>
          <circle cx="26.4" cy="190" r="7.25"/>
          <circle cx="66.9" cy="190" r="7.25"/>
          <circle cx="109.1" cy="190" r="7.25"/>
          <circle cx="149.6" cy="190" r="7.25"/>
          <circle cx="66.9" cy="323" r="7.25"/>
          <circle cx="109.1" cy="323" r="7.25"/>
          <circle cx="149.6" cy="323" r="7.25"/>
        </g>
        <g fill="var(--state-lost)" stroke="var(--stage-ink)" stroke-width="1.5">
          <circle cx="149.6" cy="57" r="7.25"/>
          <circle cx="26.4" cy="323" r="7.25"/>
        </g>
        <g fill="none" stroke="var(--badge-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22.9 57.3l2.5 2.5 4.8-5"/>
          <path d="M63.4 57.3l2.5 2.5 4.8-5"/>
          <path d="M105.6 57.3l2.5 2.5 4.8-5"/>
          <path d="M22.9 190.3l2.5 2.5 4.8-5"/>
          <path d="M63.4 190.3l2.5 2.5 4.8-5"/>
          <path d="M105.6 190.3l2.5 2.5 4.8-5"/>
          <path d="M146.1 190.3l2.5 2.5 4.8-5"/>
          <path d="M63.4 323.3l2.5 2.5 4.8-5"/>
          <path d="M105.6 323.3l2.5 2.5 4.8-5"/>
          <path d="M146.1 323.3l2.5 2.5 4.8-5"/>
          <path d="M146.6 54l6 6M152.6 54l-6 6"/>
          <path d="M23.4 320l6 6M29.4 320l-6 6"/>
        </g>
      </svg>

      <figcaption style="flex: none; display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 14px; line-height: 1.25; color: var(--color-muted-text)">
        <span style="display: inline-flex; align-items: center; gap: 8px; white-space: nowrap">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="12" fill="var(--state-good)"/><path d="M6.5 12.5l3.5 3.5 6.5-7" fill="none" stroke="var(--badge-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Hit</span>
        </span>
        <span style="display: inline-flex; align-items: center; gap: 8px; white-space: nowrap">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="12" fill="var(--state-lost)"/><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="var(--badge-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Missed</span>
        </span>
      </figcaption>
    </figure>

    <section aria-labelledby="result-title" style="flex: none; margin-top: 24px; display: flex; flex-direction: column; align-items: center; text-align: center">
      <div style="display: flex; align-items: center; justify-content: center; gap: 12px; min-block-size: 28px">
        <div role="img" aria-label="2 of 3 stars" style="display: flex; align-items: center; gap: 8px">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" style="display: block"><path d="M12 3.6L14.3 9.6L20.7 10L15.7 14L17.4 20.2L12 16.7L6.6 20.2L8.3 14L3.3 10L9.7 9.6Z" fill="var(--star-on)" stroke="var(--star-on)" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" style="display: block"><path d="M12 3.6L14.3 9.6L20.7 10L15.7 14L17.4 20.2L12 16.7L6.6 20.2L8.3 14L3.3 10L9.7 9.6Z" fill="var(--star-on)" stroke="var(--star-on)" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" style="display: block"><path d="M12 3.6L14.3 9.6L20.7 10L15.7 14L17.4 20.2L12 16.7L6.6 20.2L8.3 14L3.3 10L9.7 9.6Z" fill="none" stroke="var(--star-off)" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </div>
        <span class="ex">Example</span>
      </div>

      <h1 id="result-title" style="margin: 8px 0 0; font-family: var(--font-serif); font-size: 28px; font-weight: 600; line-height: 1.25; color: var(--color-text)">You unlocked 3 zones</h1>

      <p style="margin: 4px 0 0; font-size: 16px; font-weight: 400; line-height: 1.55; color: var(--color-text)">The challenge will use these 3 zones.</p>

      <p style="margin: 4px 0 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 400; line-height: 1.55; color: var(--color-muted-text)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        <span>More light in front of you may help.</span>
      </p>

      <button type="button" aria-haspopup="dialog" style="display: inline-flex; align-items: center; justify-content: center; min-block-size: 44px; padding: 0; border: 0; background: none; color: var(--color-link); font-family: var(--font-sans); font-size: 14px; font-weight: 400; line-height: 1.25; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Rule of thumb · How we judge this</button>
    </section>

    <div style="flex: none; margin-top: 24px; display: flex; gap: 8px">
      <a class="btn btn--secondary" href="phone-level1-pop.dc.html" style="flex: 0 0 auto; min-block-size: 56px">Warm up again</a>
      <a class="btn btn--primary" href="phone-free-look.dc.html" style="flex: 1 0 auto; min-block-size: 56px">Try your zones</a>
    </div>

  </main>
</div>
</x-dc>

</body>
