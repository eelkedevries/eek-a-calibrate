<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Webcam · Challenge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Spectral:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7fb4ec}a:hover{color:#a9cdf3}


*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  /* eek-a-style roles: dark identity default (data/visual/tokens.css) */
  --color-text:#f4f2ec;
  --color-muted-text:#9a9aa4;
  --color-faint:#787884;
  --color-background:#08080b;
  --color-surface:#17181e;
  --color-border:#2a2a35;
  --color-accent:#e8b43a;
  --color-accent-ink:#1a1400;
  --color-secondary:#6ba6e4;
  --color-secondary-muted:#69707d;
  --color-link:#7fb4ec;
  --color-success:#3ad08a;
  --color-warning:#f0b429;
  --color-error:#ff6f61;
  --color-info:#6ba6e4;
  --color-focus:#6ba6e4;
  --color-reference:#000000;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:40px;
  --radius-control:12px;--radius-card:14px;--radius-sheet:22px;--radius-pill:999px;
  --font-serif:Spectral,'Iowan Old Style',Georgia,serif;
  --font-sans:Lexend,Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',SFMono-Regular,Consolas,monospace;
  --font-size-sm:14px;--font-size-md:16px;--font-size-lg:20px;--font-size-xl:28px;
  --font-weight-regular:400;--font-weight-medium:500;--font-weight-bold:700;
  --line-height-tight:1.25;--line-height-normal:1.55;
  /* eek-a-calibrate app roles (theme-independent: the stage is always grey) */
  --stage:#808080;
  --stage-ink:#000000;
  --stage-veil:rgb(128 128 128 / 0.86);
  --stage-line:rgb(0 0 0 / 0.28);
  --stage-lit:rgb(255 255 255 / 0.18);
  --stage-scrim:rgb(0 0 0 / 0.55);
  --stage-chip:rgb(23 24 30 / 0.92);
  --stage-chip-raise:rgb(255 255 255 / 0.08);
  --stage-chip-text:#f4f2ec;
  --stage-chip-muted:#9a9aa4;
  --stage-focus:#ffffff;
  --state-good:#3ad08a;
  --state-adjust:#f0b429;
  --state-lost:#ff6f61;
  --halo:rgb(0 0 0 / 0.6);
  --preview-bg:#1c1d23;
  --preview-figure:#34363f;
  --preview-edge:#4a4d58;
  --preview-bright:#a9aab2;
  --preview-dark:#141519;
  --badge-ink:#17181e;
  --gaze:#6ba6e4;
  --gaze-soft:rgb(107 166 228 / 0.42);
  --gaze-outline:#000000;
  /* v2 game roles: one bubble everywhere (warm-up, re-aim, challenge) */
  --bubble-fill:rgb(255 255 255 / 0.30);
  --bubble-edge:#000000;
  --bubble-shine:#ffffff;
  --bubble-core:#000000;
  --bubble-ghost:rgb(0 0 0 / 0.30);
  --firefly-light:rgb(255 255 255 / 0.45);
  --firefly-trail:rgb(255 255 255 / 0.40);
  --decoy:#24242a;
  --pip-on:#000000;
  --pip-off:rgb(0 0 0 / 0.22);
  --arc-on:#000000;
  --arc-off:rgb(0 0 0 / 0.60);
  --node-done:rgb(255 255 255 / 0.12);
  --node-line:rgb(255 255 255 / 0.35);
  --star-on:var(--color-text);
  --star-off:var(--color-faint);
  --control-boundary:var(--color-faint);
  --tap:44px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --color-text:#1a1a1a;--color-muted-text:#5a5a5a;--color-faint:#70707a;
  --color-background:#ffffff;--color-surface:#f5f5f5;--color-border:#d9d9d9;
  --color-accent:#8a6d00;--color-accent-ink:#ffffff;
  --color-secondary:#1a6cb0;--color-secondary-muted:#6b7280;--color-link:#0061a8;
  --color-success:#1b7a4b;--color-warning:#8a5a00;--color-error:#b3261e;
  --color-info:#1a6cb0;--color-focus:#1a6cb0;
}
body{background:var(--color-background);color:var(--color-text);font-family:var(--font-sans);font-size:var(--font-size-md);line-height:var(--line-height-normal);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
.on-stage :focus-visible{outline-color:var(--stage-focus)}
@keyframes ek-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ek-live{animation:ek-pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ek-live{animation:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);min-block-size:var(--tap);padding:0 20px;border:1px solid transparent;border-radius:var(--radius-control);font-family:var(--font-sans);font-size:var(--font-size-md);font-weight:var(--font-weight-medium);line-height:var(--line-height-tight);white-space:nowrap;text-decoration:none;cursor:pointer;transition:background-color .2s ease-out,border-color .2s ease-out,box-shadow .2s ease-out}
.btn--primary,a.btn--primary,a.btn--primary:hover{background:var(--color-accent);color:var(--color-accent-ink)}
.btn--primary:hover{box-shadow:inset 0 0 0 999px rgb(255 255 255 / 0.10)}
.btn--secondary,a.btn--secondary,a.btn--secondary:hover{background:var(--color-surface);color:var(--color-text);border-color:var(--control-boundary)}
.btn--secondary:hover{border-color:var(--color-accent)}
.btn--ghost,a.btn--ghost,a.btn--ghost:hover{background:transparent;color:var(--color-text)}
.btn--ghost:hover{background:var(--color-surface)}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--color-surface);color:var(--color-muted-text);border-color:var(--color-border);box-shadow:none;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;inline-size:var(--tap);block-size:var(--tap);padding:0;border:0;border-radius:var(--radius-pill);background:transparent;color:inherit;cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--stage-chip-raise)}
.btn--chip,a.btn--chip,a.btn--chip:hover{background:var(--stage-chip-raise);color:var(--stage-chip-text);border-color:rgb(255 255 255 / 0.28)}
.btn--chip:hover{border-color:var(--color-accent)}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;min-block-size:72px;padding:8px 4px;border:1.5px solid var(--control-boundary);border-radius:var(--radius-control);background:var(--color-surface);color:var(--color-muted-text);font-family:var(--font-sans);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-tight);white-space:nowrap;cursor:pointer;transition:border-color .2s ease-out,color .2s ease-out,background-color .2s ease-out}
.choice:hover{border-color:var(--color-muted-text)}
.choice[aria-checked="true"]{border-color:var(--color-text);color:var(--color-text);background:var(--node-done)}
.chip{display:inline-flex;align-items:center;gap:6px;min-block-size:32px;padding:0 12px;border-radius:var(--radius-pill);background:var(--color-surface);color:var(--color-text);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-tight);white-space:nowrap}
.ex{display:inline-flex;align-items:center;min-block-size:24px;padding:0 8px;border:1px dashed var(--color-muted-text);border-radius:var(--radius-pill);color:var(--color-muted-text);font-size:var(--font-size-sm);font-weight:var(--font-weight-regular);line-height:1;white-space:nowrap}
.sr-only{position:absolute;inline-size:1px;block-size:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; box-sizing: border-box; padding: 24px 40px; background: var(--color-background); color: var(--color-text); font-family: var(--font-sans); display: grid; grid-template-areas: 'top top' 'stage side'; grid-template-rows: 48px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) 420px; column-gap: 40px; row-gap: 24px">

  <header style="grid-area: top; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px; min-inline-size: 0">

    <div style="justify-self: start; display: flex; align-items: center; gap: 8px; min-inline-size: 0">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2.6-4.2 6-6.3 10-6.3s7.4 2.1 10 6.3c-2.6 4.2-6 6.3-10 6.3S4.6 16.2 2 12z"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg>
      <span style="font-family: var(--font-serif); font-size: 20px; font-weight: 600; line-height: 1.25; color: var(--color-text); white-space: nowrap">eek-a-calibrate</span>
    </div>

    <ol aria-label="Game progress" style="justify-self: center; display: flex; align-items: center; gap: 8px; margin: 0; padding: 0; list-style: none">
        <li style="display: flex; align-items: center; gap: 8px">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="12" fill="var(--node-done)"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="var(--color-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--color-muted-text); white-space: nowrap"><span class="sr-only">Level 1, done: </span>Pop</span>
        </li>
        <li style="display: flex; align-items: center; gap: 8px">
          <span aria-hidden="true" style="display: block; inline-size: 24px; block-size: 1.5px; background: var(--node-line)"></span>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="12" fill="var(--node-done)"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="var(--color-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--color-muted-text); white-space: nowrap"><span class="sr-only">Level 2, done: </span>Follow</span>
        </li>
        <li style="display: flex; align-items: center; gap: 8px">
          <span aria-hidden="true" style="display: block; inline-size: 24px; block-size: 1.5px; background: var(--node-line)"></span>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="12" fill="var(--node-done)"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="var(--color-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--color-muted-text); white-space: nowrap"><span class="sr-only">Level 3, done: </span>Turn</span>
        </li>
        <li style="display: flex; align-items: center; gap: 8px">
          <span aria-hidden="true" style="display: block; inline-size: 24px; block-size: 1.5px; background: var(--node-line)"></span>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="12" fill="var(--node-done)"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="var(--color-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span style="font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--color-muted-text); white-space: nowrap"><span class="sr-only">Level 4, done: </span>Test</span>
        </li>
        <li aria-current="step" style="display: flex; align-items: center; gap: 8px">
          <span aria-hidden="true" style="display: block; inline-size: 24px; block-size: 1.5px; background: var(--node-line)"></span>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="12" fill="var(--color-text)"/><path d="M12 5.5L13.7 10.1L18.7 10.3L14.8 13.4L16.1 18.2L12 15.4L7.9 18.2L9.2 13.4L5.3 10.3L10.3 10.1Z" fill="var(--color-background)" stroke="none"/></svg>
          <span style="font-size: 14px; font-weight: 500; line-height: 1.25; color: var(--color-text); white-space: nowrap">Challenge</span>
        </li>
    </ol>

    <div style="justify-self: end; display: flex; align-items: center">
      <button class="btn btn--ghost" type="button" style="min-block-size: 48px; padding: 0 12px">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex: none"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
        <span>Details</span>
      </button>
    </div>
  </header>

  <section aria-label="Where you looked" style="grid-area: stage; position: relative; min-inline-size: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; border-radius: var(--radius-card); background: var(--color-surface)">
    <span class="ex" style="position: absolute; top: 16px; left: 16px">Example</span>
    <button class="icon-btn" type="button" aria-label="Replay where you looked" style="position: absolute; top: 12px; right: 12px; color: var(--color-text)">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></svg>
    </button>

    <svg viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Left zone 5 of 5, middle 6 of 6, right 3 of 5." style="display: block; flex: none">
      <rect x="0" y="0" width="640" height="400" rx="14" fill="var(--stage)"/>
      <rect x="16" y="16" width="192" height="368" rx="12" fill="none" stroke="var(--stage-line)" stroke-width="1.5"/>
      <rect x="224" y="16" width="192" height="368" rx="12" fill="none" stroke="var(--stage-line)" stroke-width="1.5"/>
      <rect x="432" y="16" width="192" height="368" rx="12" fill="none" stroke="var(--stage-line)" stroke-width="1.5"/>
      <text x="112" y="196" text-anchor="middle" font-family="var(--font-mono)" font-size="20" font-weight="500" fill="var(--stage-ink)">5 of 5</text>
      <circle cx="112" cy="232" r="12" fill="var(--state-good)" stroke="var(--stage-ink)" stroke-width="1.5"/>
      <path d="M106.5 232.5l3.5 3.5 6.5-7" fill="none" stroke="var(--badge-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="320" y="196" text-anchor="middle" font-family="var(--font-mono)" font-size="20" font-weight="500" fill="var(--stage-ink)">6 of 6</text>
      <circle cx="320" cy="232" r="12" fill="var(--state-good)" stroke="var(--stage-ink)" stroke-width="1.5"/>
      <path d="M314.5 232.5l3.5 3.5 6.5-7" fill="none" stroke="var(--badge-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="528" y="196" text-anchor="middle" font-family="var(--font-mono)" font-size="20" font-weight="500" fill="var(--stage-ink)">3 of 5</text>
      <circle cx="528" cy="232" r="12" fill="var(--state-adjust)" stroke="var(--stage-ink)" stroke-width="1.5"/>
      <path d="M522.5 233c1.8-2.4 3.6-2.4 5.5 0s3.7 2.4 5.5 0" fill="none" stroke="var(--badge-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p style="margin: 0; font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--color-muted-text)">Bubbles popped in each zone</p>
  </section>

  <section aria-labelledby="round-result" style="grid-area: side; min-inline-size: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center">
    <p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 1.25; color: var(--color-muted-text)">Round 1 of 3</p>

    <div style="margin-block-start: 12px; display: flex; align-items: center; gap: 12px">
      <div role="img" aria-label="2 of 3 stars" style="display: flex; align-items: center; gap: 8px">
        <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M12 3.6L14.3 9.6L20.7 10L15.7 14L17.4 20.2L12 16.7L6.6 20.2L8.3 14L3.3 10L9.7 9.6Z" fill="var(--star-on)" stroke="none"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M12 3.6L14.3 9.6L20.7 10L15.7 14L17.4 20.2L12 16.7L6.6 20.2L8.3 14L3.3 10L9.7 9.6Z" fill="var(--star-on)" stroke="none"/></svg>
        <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M12 3.6L14.3 9.6L20.7 10L15.7 14L17.4 20.2L12 16.7L6.6 20.2L8.3 14L3.3 10L9.7 9.6Z" fill="none" stroke="var(--star-off)" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
      <span class="ex">Example</span>
    </div>

    <h1 id="round-result" style="margin: 16px 0 0; font-family: var(--font-serif); font-size: 36px; font-weight: 600; line-height: 1.25; color: var(--color-text); white-space: nowrap">14 of 16 popped</h1>

    <p style="margin: 12px 0 0; font-size: 16px; font-weight: 400; line-height: 1.55; color: var(--color-text)">The right zone was the hardest.</p>

    <div style="margin-block-start: 12px; display: flex; align-items: center; gap: 8px">
      <span style="font-family: var(--font-mono); font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--color-muted-text); white-space: nowrap">Score 1&#160;820 · Best 1&#160;820</span>
      <span class="ex">Example</span>
    </div>

    <div style="margin-block-start: 32px; display: flex; align-items: center; gap: 8px">
      <a class="btn btn--secondary" href="desktop-free-look.dc.html" style="min-block-size: 48px">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex: none" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        <span>Free look</span>
      </a>
      <button class="btn btn--primary" type="button" style="min-block-size: 48px; padding: 0 24px">Next round</button>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
