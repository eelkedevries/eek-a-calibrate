<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Webcam · Get ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Spectral:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7fb4ec}a:hover{color:#a9cdf3}

*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  /* eek-a-style roles: dark identity default (data/visual/tokens.css) */
  --color-text:#f4f2ec;
  --color-muted-text:#9a9aa4;
  --color-faint:#787884;
  --color-background:#08080b;
  --color-surface:#17181e;
  --color-border:#2a2a35;
  --color-accent:#e8b43a;
  --color-accent-ink:#1a1400;
  --color-secondary:#6ba6e4;
  --color-secondary-muted:#69707d;
  --color-link:#7fb4ec;
  --color-success:#3ad08a;
  --color-warning:#f0b429;
  --color-error:#ff6f61;
  --color-info:#6ba6e4;
  --color-focus:#6ba6e4;
  --color-reference:#000000;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:40px;
  --radius-control:12px;--radius-card:14px;--radius-sheet:22px;--radius-pill:999px;
  --font-serif:Spectral,'Iowan Old Style',Georgia,serif;
  --font-sans:Lexend,Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',SFMono-Regular,Consolas,monospace;
  --font-size-sm:14px;--font-size-md:16px;--font-size-lg:20px;--font-size-xl:28px;
  --font-weight-regular:400;--font-weight-medium:500;--font-weight-bold:700;
  --line-height-tight:1.25;--line-height-normal:1.55;
  /* eek-a-calibrate app roles (theme-independent: the stage is always grey) */
  --stage:#808080;
  --stage-ink:#000000;
  --stage-veil:rgb(128 128 128 / 0.86);
  --stage-line:rgb(0 0 0 / 0.28);
  --stage-lit:rgb(255 255 255 / 0.18);
  --stage-scrim:rgb(0 0 0 / 0.55);
  --stage-chip:rgb(23 24 30 / 0.92);
  --stage-chip-raise:rgb(255 255 255 / 0.08);
  --stage-chip-text:#f4f2ec;
  --stage-chip-muted:#9a9aa4;
  --stage-focus:#ffffff;
  --state-good:#3ad08a;
  --state-adjust:#f0b429;
  --state-lost:#ff6f61;
  --halo:rgb(0 0 0 / 0.6);
  --preview-bg:#1c1d23;
  --preview-figure:#34363f;
  --preview-edge:#4a4d58;
  --preview-bright:#a9aab2;
  --preview-dark:#141519;
  --badge-ink:#17181e;
  --gaze:#6ba6e4;
  --gaze-soft:rgb(107 166 228 / 0.42);
  --gaze-outline:#000000;
  /* v2 game roles: one bubble everywhere (warm-up, re-aim, challenge) */
  --bubble-fill:rgb(255 255 255 / 0.30);
  --bubble-edge:#000000;
  --bubble-shine:#ffffff;
  --bubble-core:#000000;
  --bubble-ghost:rgb(0 0 0 / 0.30);
  --firefly-light:rgb(255 255 255 / 0.45);
  --firefly-trail:rgb(255 255 255 / 0.40);
  --decoy:#24242a;
  --pip-on:#000000;
  --pip-off:rgb(0 0 0 / 0.22);
  --arc-on:#000000;
  --arc-off:rgb(0 0 0 / 0.60);
  --node-done:rgb(255 255 255 / 0.12);
  --node-line:rgb(255 255 255 / 0.35);
  --star-on:var(--color-text);
  --star-off:var(--color-faint);
  --control-boundary:var(--color-faint);
  --tap:44px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --color-text:#1a1a1a;--color-muted-text:#5a5a5a;--color-faint:#70707a;
  --color-background:#ffffff;--color-surface:#f5f5f5;--color-border:#d9d9d9;
  --color-accent:#8a6d00;--color-accent-ink:#ffffff;
  --color-secondary:#1a6cb0;--color-secondary-muted:#6b7280;--color-link:#0061a8;
  --color-success:#1b7a4b;--color-warning:#8a5a00;--color-error:#b3261e;
  --color-info:#1a6cb0;--color-focus:#1a6cb0;
}
body{background:var(--color-background);color:var(--color-text);font-family:var(--font-sans);font-size:var(--font-size-md);line-height:var(--line-height-normal);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--color-focus);outline-offset:2px}
.on-stage :focus-visible{outline-color:var(--stage-focus)}
@keyframes ek-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ek-live{animation:ek-pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ek-live{animation:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-sm);min-block-size:var(--tap);padding:0 20px;border:1px solid transparent;border-radius:var(--radius-control);font-family:var(--font-sans);font-size:var(--font-size-md);font-weight:var(--font-weight-medium);line-height:var(--line-height-tight);white-space:nowrap;text-decoration:none;cursor:pointer;transition:background-color .2s ease-out,border-color .2s ease-out,box-shadow .2s ease-out}
.btn--primary,a.btn--primary,a.btn--primary:hover{background:var(--color-accent);color:var(--color-accent-ink)}
.btn--primary:hover{box-shadow:inset 0 0 0 999px rgb(255 255 255 / 0.10)}
.btn--secondary,a.btn--secondary,a.btn--secondary:hover{background:var(--color-surface);color:var(--color-text);border-color:var(--control-boundary)}
.btn--secondary:hover{border-color:var(--color-accent)}
.btn--ghost,a.btn--ghost,a.btn--ghost:hover{background:transparent;color:var(--color-text)}
.btn--ghost:hover{background:var(--color-surface)}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--color-surface);color:var(--color-muted-text);border-color:var(--color-border);box-shadow:none;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;inline-size:var(--tap);block-size:var(--tap);padding:0;border:0;border-radius:var(--radius-pill);background:transparent;color:inherit;cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--stage-chip-raise)}
.btn--chip,a.btn--chip,a.btn--chip:hover{background:var(--stage-chip-raise);color:var(--stage-chip-text);border-color:rgb(255 255 255 / 0.28)}
.btn--chip:hover{border-color:var(--color-accent)}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;min-block-size:72px;padding:8px 4px;border:1.5px solid var(--control-boundary);border-radius:var(--radius-control);background:var(--color-surface);color:var(--color-muted-text);font-family:var(--font-sans);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-tight);white-space:nowrap;cursor:pointer;transition:border-color .2s ease-out,color .2s ease-out,background-color .2s ease-out}
.choice:hover{border-color:var(--color-muted-text)}
.choice[aria-checked="true"]{border-color:var(--color-text);color:var(--color-text);background:var(--node-done)}
.chip{display:inline-flex;align-items:center;gap:6px;min-block-size:32px;padding:0 12px;border-radius:var(--radius-pill);background:var(--color-surface);color:var(--color-text);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:var(--line-height-tight);white-space:nowrap}
.ex{display:inline-flex;align-items:center;min-block-size:24px;padding:0 8px;border:1px dashed var(--color-muted-text);border-radius:var(--radius-pill);color:var(--color-muted-text);font-size:var(--font-size-sm);font-weight:var(--font-weight-regular);line-height:1;white-space:nowrap}
.sr-only{position:absolute;inline-size:1px;block-size:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div class="on-stage" style="position: relative; width: 1440px; height: 900px; overflow: hidden; box-sizing: border-box; background: var(--preview-bg); color: var(--color-text); font-family: var(--font-sans)">

  <svg viewBox="0 0 1440 900" width="1440" height="900" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
    <path d="M330 900C350 720 520 680 720 680S1090 720 1110 900Z" fill="var(--preview-figure)"/>
    <ellipse cx="720" cy="432" rx="152" ry="198" fill="var(--preview-figure)" stroke="var(--preview-edge)" stroke-width="1"/>
    <path fill-rule="evenodd" fill="var(--stage-veil)" d="M0 0H1440V900H0ZM552 423A168 218 0 1 0 888 423A168 218 0 1 0 552 423Z"/>
    <ellipse cx="720" cy="423" rx="168" ry="218" fill="none" stroke="var(--halo)" stroke-width="8"/>
    <ellipse cx="720" cy="423" rx="168" ry="218" fill="none" stroke="var(--state-good)" stroke-width="5"/>
    <ellipse cx="720" cy="428" rx="148" ry="194" fill="none" stroke="var(--halo)" stroke-width="5"/>
    <ellipse cx="720" cy="428" rx="148" ry="194" fill="none" stroke="var(--color-text)" stroke-width="2"/>
    <circle cx="663" cy="398" r="6" fill="var(--gaze)" stroke="var(--gaze-outline)" stroke-width="1.5"/>
    <circle cx="777" cy="398" r="6" fill="var(--gaze)" stroke="var(--gaze-outline)" stroke-width="1.5"/>
    <circle cx="720" cy="205" r="12" fill="var(--state-good)" stroke="var(--stage-ink)" stroke-width="1.5"/>
    <path d="M714.5 205.5l3.5 3.5 6.5-7" fill="none" stroke="var(--badge-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <header style="position: absolute; top: 24px; left: 24px; width: 1392px; height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; padding: 0 8px 0 20px; border-radius: var(--radius-pill); background: var(--stage-chip); color: var(--stage-chip-text)">

    <div style="justify-self: start; display: flex; align-items: center; gap: 8px; min-inline-size: 0">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2.6-4.2 6-6.3 10-6.3s7.4 2.1 10 6.3c-2.6 4.2-6 6.3-10 6.3S4.6 16.2 2 12z"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg>
      <span style="font-family: var(--font-serif); font-size: 20px; font-weight: 600; line-height: 1.25; color: var(--stage-chip-text); white-space: nowrap">eek-a-calibrate</span>
    </div>

    <div style="justify-self: center; display: flex; align-items: center; gap: 16px">
      <span style="font-size: 14px; font-weight: 500; line-height: 1.25; color: var(--stage-chip-text); white-space: nowrap">Get ready</span>
      <span aria-hidden="true" style="display: block; inline-size: 1px; block-size: 20px; background: var(--node-line)"></span>
      <ol aria-label="Game progress" style="display: flex; align-items: center; gap: 8px; margin: 0; padding: 0; list-style: none">
        <li style="display: flex; align-items: center; gap: 8px">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none; font-family: var(--font-sans)"><circle cx="12" cy="12" r="11.25" fill="none" stroke="var(--node-line)" stroke-width="1.5"/><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-muted-text)">1</text></svg>
          <span style="font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--stage-chip-muted); white-space: nowrap"><span class="sr-only">Level 1, next: </span>Pop</span>
        </li>
        <li style="display: flex; align-items: center; gap: 8px">
          <span aria-hidden="true" style="display: block; inline-size: 24px; block-size: 1.5px; background: var(--node-line)"></span>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none; font-family: var(--font-sans)"><circle cx="12" cy="12" r="11.25" fill="none" stroke="var(--node-line)" stroke-width="1.5"/><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-muted-text)">2</text></svg>
          <span style="font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--stage-chip-muted); white-space: nowrap"><span class="sr-only">Level 2: </span>Follow</span>
        </li>
        <li style="display: flex; align-items: center; gap: 8px">
          <span aria-hidden="true" style="display: block; inline-size: 24px; block-size: 1.5px; background: var(--node-line)"></span>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none; font-family: var(--font-sans)"><circle cx="12" cy="12" r="11.25" fill="none" stroke="var(--node-line)" stroke-width="1.5"/><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-muted-text)">3</text></svg>
          <span style="font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--stage-chip-muted); white-space: nowrap"><span class="sr-only">Level 3: </span>Turn</span>
        </li>
        <li style="display: flex; align-items: center; gap: 8px">
          <span aria-hidden="true" style="display: block; inline-size: 24px; block-size: 1.5px; background: var(--node-line)"></span>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none; font-family: var(--font-sans)"><circle cx="12" cy="12" r="11.25" fill="none" stroke="var(--node-line)" stroke-width="1.5"/><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-muted-text)">4</text></svg>
          <span style="font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--stage-chip-muted); white-space: nowrap"><span class="sr-only">Level 4: </span>Test</span>
        </li>
        <li style="display: flex; align-items: center; gap: 8px">
          <span aria-hidden="true" style="display: block; inline-size: 24px; block-size: 1.5px; background: var(--node-line)"></span>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="11.25" fill="none" stroke="var(--node-line)" stroke-width="1.5"/><path d="M12 5.5L13.7 10.1L18.7 10.3L14.8 13.4L16.1 18.2L12 15.4L7.9 18.2L9.2 13.4L5.3 10.3L10.3 10.1Z" fill="none" stroke="var(--color-muted-text)" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span style="font-size: 14px; font-weight: 400; line-height: 1.25; color: var(--stage-chip-muted); white-space: nowrap">Challenge<span class="sr-only">, locked</span></span>
        </li>
      </ol>
    </div>

    <div style="justify-self: end; display: flex; align-items: center">
      <button class="btn btn--ghost" type="button" style="min-block-size: 48px; padding: 0 12px; border-radius: var(--radius-pill); color: var(--stage-chip-text)">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex: none"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
        <span>Details</span>
      </button>
    </div>
  </header>

  <div style="position: absolute; top: 88px; left: 0; width: 1440px; display: flex; justify-content: center">
    <div role="status" aria-live="polite" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 20px; border-radius: var(--radius-card); background: var(--stage-chip); text-align: center">
      <span style="font-size: 20px; font-weight: 500; line-height: 1.25; color: var(--stage-chip-text); white-space: nowrap">Ready</span>
      <span style="font-size: 14px; font-weight: 400; line-height: 1.55; color: var(--stage-chip-muted); white-space: nowrap">Stay like this while you play</span>
    </div>
  </div>

  <div style="position: absolute; top: 796px; left: 360px; width: 720px; height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 24px; border-radius: var(--radius-card); background: var(--stage-chip)">
    <div style="display: flex; align-items: center; gap: 24px">
      <span role="img" aria-label="Distance: good" style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; line-height: 1.25; color: var(--stage-chip-text); white-space: nowrap">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="12" fill="var(--state-good)"/><path d="M6.5 12.5l3.5 3.5 6.5-7" fill="none" stroke="var(--badge-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Distance</span>
      </span>
      <span role="img" aria-label="Position: good" style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; line-height: 1.25; color: var(--stage-chip-text); white-space: nowrap">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="12" fill="var(--state-good)"/><path d="M6.5 12.5l3.5 3.5 6.5-7" fill="none" stroke="var(--badge-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Position</span>
      </span>
      <span role="img" aria-label="Light: good" style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; line-height: 1.25; color: var(--stage-chip-text); white-space: nowrap">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="12" fill="var(--state-good)"/><path d="M6.5 12.5l3.5 3.5 6.5-7" fill="none" stroke="var(--badge-ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Light</span>
      </span>
    </div>
    <a class="btn btn--primary" href="desktop-level1-pop.dc.html" style="min-block-size: 48px; padding: 0 24px">Start warm-up</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
